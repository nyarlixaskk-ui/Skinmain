<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skinmain</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#06060f;
  color:#fff;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
}

.logo{
  font-weight:600;
}

.menu-btn{
  padding:8px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);
  cursor:pointer;
}

/* MENU */
#menu{
  position:fixed;
  top:0;
  right:-100%;
  width:75%;
  height:100%;
  background:#0c0c18;
  display:flex;
  flex-direction:column;
  padding:80px 30px;
  gap:25px;
  transition:.35s ease;
  z-index:999;
}

#menu a{
  color:#fff;
  text-decoration:none;
  font-size:20px;
}

/* HERO */
.hero{
  padding:40px 20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero span{
  color:#a855f7;
}

.hero p{
  opacity:.7;
  margin-bottom:20px;
}

/* BUTTON */
.btn{
  display:inline-block;
  padding:12px 24px;
  border-radius:12px;
  background:linear-gradient(135deg,#5865F2,#a855f7);
  border:none;
  color:#fff;
  cursor:pointer;
}

/* SECTION */
.section{
  padding:25px 16px;
}

.section h2{
  margin-bottom:15px;
}

/* CARD */
.card{
  background:#0f0f1f;
  border-radius:16px;
  padding:10px;
  margin-bottom:14px;
}

.card img{
  width:100%;
  border-radius:12px;
}

/* TEXT */
.card h3{
  margin-top:8px;
  font-size:16px;
}

/* SOCIAL */
.social{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.social div{
  background:#111122;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

/* CTA */
.cta{
  text-align:center;
  padding:30px 20px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:15px;
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>

<nav>
  <div class="logo">Skinmain</div>
  <div class="menu-btn" onclick="toggleMenu()">Menu</div>
</nav>

<div id="menu">
  <a href="#">Home</a>
  <a href="#">Portfolio</a>
  <a href="#">Pricing</a>
  <a href="#">Reviews</a>
</div>

<section class="hero">
  <h1>Create Your <span>Perfect Skin</span></h1>
  <p>Custom Minecraft skins crafted by professionals</p>
  <button class="btn">Order Now</button>
</section>

<section class="section">
  <h2>Portfolio</h2>

  <div class="card">
    <img src="Showcase1.webp">
    <h3>Reze</h3>
  </div>

  <div class="card">
    <img src="Showcase2.webp">
    <h3>Pomni</h3>
  </div>

  <div class="card">
    <img src="Showcase3.webp">
    <h3>Hatsune Miku</h3>
  </div>
</section>

<section class="section">
  <h2>Reviews</h2>

  <div class="card">
    <img src="Review1.webp">
    <h3>Amazing skin</h3>
  </div>

  <div class="card">
    <img src="Review2.webp">
    <h3>Perfect shading</h3>
  </div>
</section>

<section class="section">
  <h2>Follow Us</h2>

  <div class="social">
    <div>Discord</div>
    <div>Instagram</div>
    <div>TikTok</div>
  </div>
</section>

<section class="cta">
  <h2>Start Your Project</h2>
  <button class="btn">Open Ticket</button>
</section>

<footer>
  © 2026 Skinmain
</footer>

<script>
function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.right = (menu.style.right === "0px") ? "-100%" : "0";
}
</script>

</body>
</html>
